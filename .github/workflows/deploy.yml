name: Build and Deploy hosted MCP server

# Mirrors atoms-platform's integrations-deploy.yaml.
#
# PREREQUISITES, none of which this repo can create for itself:
#   - ECR repos <env>/mcp in account 301490598848 (smallest-infra)
#   - helm-charts/mcp/env/<env>/ap-south-1.yaml in smallest-infra
#   - repo secrets GH_APP_ID and GH_APP_PRIVATE_KEY, for the app token that
#     pushes the image-tag bump to smallest-infra
#   - GitHub Environments named dev and prod WITH protection rules. GitHub
#     auto-creates them unprotected on first use, so the approval gate is
#     nominal until someone configures reviewers.
#   - smallest-prod-mcp-deploy-role (smallest-infra#1792), which only this repo's
#     prod environment can assume and which can only push to prod/mcp
#   - variables MCP_PUBLIC_URL_DEV and MCP_PUBLIC_URL_PROD for the post-deploy
#     check; it is skipped with a warning until they are set
# Until those exist this workflow will fail at the first AWS step, by design —
# it is not wired to any push trigger.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: "dev"

# Least privilege by default; only build-and-push needs an OIDC token.
permissions:
  contents: read

# Two dispatches close together would race on the smallest-infra checkout: the
# second push is rejected non-fast-forward, the image is already in ECR, and the
# run goes red with the tag never deployed.
concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # On the job that pushes to ECR, not only on the deploy: without it the prod
    # image is built and pushed before any reviewer sees the run. The branch
    # guard below stops accidents, not intent — workflow_dispatch runs the
    # workflow file from the selected ref, so the real control is the
    # environment's protection rules, which have to be configured in the repo.
    environment: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.set-vars.outputs.image_tag }}
      environment: ${{ steps.set-vars.outputs.environment }}

    steps:
      - name: Validate branch for prod deployment
        if: github.event.inputs.environment == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deployments are only allowed from the main branch. Current branch: ${GITHUB_REF}"
          exit 1

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set environment and image tag
        id: set-vars
        run: |
          echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          echo "image_tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials (ap-south-1)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          # Prod gets its own role, which only this repo's prod environment can
          # assume and which can only push to prod/mcp. That separates the
          # workflow as written; it does not stop an edited copy on another
          # branch from using the dev role, whose ECR scope is wider. The prod
          # environment's reviewers and main-only branch rule are what gate that.
          role-to-assume: ${{ github.event.inputs.environment == 'prod' && 'arn:aws:iam::301490598848:role/smallest-prod-mcp-deploy-role' || 'arn:aws:iam::301490598848:role/smallest-dev-iam-github-eks-role' }}
          aws-region: ap-south-1

      - name: Login to ECR (ap-south-1)
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: 301490598848

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Layer cache lives in ECR under the `buildcache` tag. ignore-error on
      # cache-to: a failed cache export must never fail the deploy.
      - name: Build and push image (ap-south-1)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          # The general node pools are amd64 only (karpenter-config nodepool-general).
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          provenance: false
          tags: |
            301490598848.dkr.ecr.ap-south-1.amazonaws.com/${{ steps.set-vars.outputs.environment }}/mcp:${{ steps.set-vars.outputs.image_tag }}
          cache-from: type=registry,ref=301490598848.dkr.ecr.ap-south-1.amazonaws.com/${{ steps.set-vars.outputs.environment }}/mcp:buildcache
          cache-to: type=registry,ref=301490598848.dkr.ecr.ap-south-1.amazonaws.com/${{ steps.set-vars.outputs.environment }}/mcp:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ needs.build-and-push.outputs.environment }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: smallest-inc
          repositories: smallest-infra

      - name: Checkout smallest-infra repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: smallest-inc/smallest-infra
          token: ${{ steps.app-token.outputs.token }}
          path: smallest-infra

      # ArgoCD syncs from the chart, so the deploy is a commit to it.
      # yq is preinstalled on ubuntu-latest. The mikefarah/yq action is a Docker
      # action that runs yq rather than installing it, so invoking it bare
      # installed nothing and only worked by accident.
      - name: Update image tag in helm values
        env:
          TAG_SHA: ${{ needs.build-and-push.outputs.image_tag }}
          ENVIRONMENT: ${{ needs.build-and-push.outputs.environment }}
        run: |
          yq -i ".image.tag = \"${TAG_SHA}\"" "smallest-infra/helm-charts/mcp/env/${ENVIRONMENT}/ap-south-1.yaml"

      - name: Commit and push helm values update
        env:
          TAG_SHA: ${{ needs.build-and-push.outputs.image_tag }}
          ENVIRONMENT: ${{ needs.build-and-push.outputs.environment }}
        run: |
          cd smallest-infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "helm-charts/mcp/env/${ENVIRONMENT}/ap-south-1.yaml"

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            SHORT_SHA="${TAG_SHA:0:7}"
            git commit -m "chore(mcp): update ${ENVIRONMENT} image tag to ${SHORT_SHA}

          Triggered by: ${{ github.repository }}@${TAG_SHA}
          Workflow: ${{ github.workflow }}
          Actor: ${{ github.actor }}"
            # Another service's deploy may land between checkout and push.
            for attempt in 1 2 3; do
              git pull --rebase origin HEAD && git push && break
              if [ "${attempt}" = 3 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
          fi

  # The run used to go green once the tag commit landed, even if ArgoCD never
  # synced or the pods crash-looped. This proves the service answers and still
  # demands a key. It cannot tell old pods from new, since nothing reports the
  # build yet.
  verify:
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the service to answer
        env:
          MCP_PUBLIC_URL: ${{ vars[format('MCP_PUBLIC_URL_{0}', needs.build-and-push.outputs.environment == 'prod' && 'PROD' || 'DEV')] }}
          ENVIRONMENT: ${{ needs.build-and-push.outputs.environment }}
        run: |
          if [ -z "${MCP_PUBLIC_URL}" ]; then
            # Repo-level variables only: this job has no environment, so an
            # environment variable of the same name is invisible here.
            if [ "${ENVIRONMENT}" = "prod" ]; then
              echo "::error::Repository variable MCP_PUBLIC_URL_PROD is not set, so prod cannot be verified"
              exit 1
            fi
            echo "::warning::Repository variable MCP_PUBLIC_URL_DEV is not set; skipping the post-deploy check"
            exit 0
          fi
          base="${MCP_PUBLIC_URL%/}"
          for attempt in $(seq 1 40); do
            ready=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "${base}/health/ready" || true)
            if [ "${ready}" = "200" ]; then
              headers=$(curl -s --max-time 10 -D - -o /dev/null -X POST -H 'Content-Type: application/json' -d '{}' "${base}/mcp" || true)
              if echo "${headers}" | head -1 | grep -q ' 401' && echo "${headers}" | grep -qi '^www-authenticate: Bearer'; then
                echo "Service is ready and requires a key"
                exit 0
              fi
            fi
            echo "Attempt ${attempt}: ready=${ready}"
            sleep 15
          done
          echo "::error::${base} did not become ready with a 401 on an unauthenticated POST /mcp"
          exit 1
