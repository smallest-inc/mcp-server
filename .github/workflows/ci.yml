name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run type-check
      - run: npm test
      - run: npm run build

      # The published package resolves its dependencies at install time, so a
      # runtime import that is only a devDependency passes every check in the
      # repo and breaks for every npx user. Install the tarball with --omit=dev
      # and drive the real binary.
      - name: stdio package runs from a clean install
        run: |
          set -euo pipefail
          npm pack --silent
          mkdir -p /tmp/pkgtest && cd /tmp/pkgtest
          npm init -y >/dev/null
          npm install --omit=dev --silent "$GITHUB_WORKSPACE"/developer-smallestai-smallest-mcp-server-*.tgz
          cd "$GITHUB_WORKSPACE"
          SMOKE_SERVER_PATH=/tmp/pkgtest/node_modules/@developer-smallestai/smallest-mcp-server/dist/index.js \
            node smoke.mjs

      # The hosted bundle ships as a single file with no node_modules. Running it
      # from an empty directory is what catches a missing "type": "module" or a
      # dependency esbuild failed to inline.
      - name: hosted bundle runs standalone
        run: |
          set -euo pipefail
          mkdir -p /tmp/httptest && cp dist/http.js /tmp/httptest/
          printf '{"type":"module"}' > /tmp/httptest/package.json
          cd /tmp/httptest
          CONSOLE_BACKEND_URL=https://console.invalid CONSOLE_API_KEY=ci PORT=8099 \
            node --no-experimental-detect-module http.js &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/health/live >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8099/health/live
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8099/mcp)" = "401"
          kill %1
