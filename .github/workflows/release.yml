name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/workflows/ci.yml"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      skipped: ${{ steps.bump.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version and tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if the latest commit already has a version tag
          EXISTING_TAG=$(git tag --points-at HEAD | grep '^v' || true)
          if [ -n "$EXISTING_TAG" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Already tagged: $EXISTING_TAG — skipping release."
            exit 0
          fi

          # Determine bump type from commit messages since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s")
          else
            COMMITS=$(git log --pretty=format:"%s")
          fi

          # new tool/resource = minor, everything else = patch
          if echo "$COMMITS" | grep -qiE "^feat(\(.*\))?!:|^BREAKING CHANGE"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "new tool|new resource|add.*tool|add.*resource"; then
            BUMP="minor"
          else
            BUMP="patch"
          fi

          echo "Bump type: $BUMP"
          npm version "$BUMP" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          git add package.json
          git commit -m "chore: bump version to ${VERSION}"
          git tag "$TAG"
          git push origin main --tags

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.skipped != 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: node22-linux-x64,node22-linux-arm64
          - os: macos-latest
            targets: node22-macos-x64,node22-macos-arm64
          - os: windows-latest
            targets: node22-win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Bundle into a single CJS file for pkg (pkg doesn't support ESM)
      - run: npx esbuild src/index.ts --platform=node --bundle --format=cjs --outfile=dist/index.cjs --packages=external --banner:js=""

      - name: Build binaries with pkg
        run: npx @yao-pkg/pkg dist/index.cjs --targets ${{ matrix.targets }} --output dist/atoms-mcp --compress GZip

      - name: Rename binaries
        shell: bash
        run: |
          cd dist
          for f in atoms-mcp-*; do
            case "$f" in
              *macos-x64*)    mv "$f" atoms-mcp-darwin-x64 ;;
              *macos-arm64*)  mv "$f" atoms-mcp-darwin-arm64 ;;
              *linux-x64*)    mv "$f" atoms-mcp-linux-x64 ;;
              *linux-arm64*)  mv "$f" atoms-mcp-linux-arm64 ;;
              *win-x64*)      mv "$f" atoms-mcp-windows-x64.exe ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist/atoms-mcp-*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            --title "MCP Server ${{ needs.version.outputs.tag }}" \
            --generate-notes \
            binaries/*

  publish-npm:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
