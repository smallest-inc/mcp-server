name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/workflows/ci.yml"
      - ".github/CODEOWNERS"

permissions:
  contents: write
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
      skipped: ${{ steps.bump.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute next version and tag
        id: bump
        run: |
          # Check if the latest commit already has a version tag
          EXISTING_TAG=$(git tag --points-at HEAD | grep '^v' || true)
          if [ -n "$EXISTING_TAG" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Already tagged: $EXISTING_TAG — skipping release."
            exit 0
          fi

          # Get last tag to determine base version
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s")
            BASE_VERSION="${LAST_TAG#v}"
          else
            COMMITS=$(git log --pretty=format:"%s")
            BASE_VERSION="0.0.0"
          fi

          # Determine bump type: new tool/resource = minor, breaking = major, else patch
          if echo "$COMMITS" | grep -qiE "^feat(\(.*\))?!:|^BREAKING CHANGE"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "new tool|new resource|add.*tool|add.*resource"; then
            BUMP="minor"
          else
            BUMP="patch"
          fi

          # Compute next version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"

          echo "Bump type: $BUMP ($BASE_VERSION → $VERSION)"

          # Delete stale remote tag if it exists (from a previous failed run)
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Deleting stale remote tag $TAG"
            git push origin ":refs/tags/${TAG}"
          fi

          # Create a lightweight tag (no commit to main needed)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "$TAG"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.skipped != 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: node22-linux-x64,node22-linux-arm64
          - os: macos-latest
            targets: node22-macos-x64,node22-macos-arm64
          - os: windows-latest
            targets: node22-win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Bundle as ESM and build standalone binaries
      - name: Bundle
        run: npx esbuild src/index.ts --platform=node --bundle --format=esm --outfile=dist/index.mjs --packages=external

      - name: Build binaries with pkg
        run: npx @yao-pkg/pkg dist/index.mjs --targets ${{ matrix.targets }} --output dist/smallest-mcp --compress GZip

      - name: Rename binaries
        shell: bash
        run: |
          cd dist
          for f in smallest-mcp-*; do
            case "$f" in
              *macos-x64*)    mv "$f" smallest-mcp-darwin-x64 ;;
              *macos-arm64*)  mv "$f" smallest-mcp-darwin-arm64 ;;
              *linux-x64*)    mv "$f" smallest-mcp-linux-x64 ;;
              *linux-arm64*)  mv "$f" smallest-mcp-linux-arm64 ;;
              *win-x64*)      mv "$f" smallest-mcp-windows-x64.exe ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist/smallest-mcp-*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            --title "MCP Server ${{ needs.version.outputs.tag }}" \
            --generate-notes \
            binaries/*

  publish-npm:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set version in package.json
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version

      - run: npm install
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
